<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d">
  <title id="t">全案の検証と、選んだ案の照合</title>
  <desc id="d">保存した HTML を、幅 1280px、高さ 720px のブラウザで開く。全案には、崩れがないこと、外部へのリクエストがないこと、危険な属性や要素がないことを確かめる（検証）。選んだ案には、必須の内容、章の順序、読み手、目的、結論の位置、分量の 6 点を要件のまとめと照合する。合わない点は直して確かめ直す。直す回数は、崩れ、安全の検査、照合のそれぞれ最大 3 回。</desc>
  <style>
    text { font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; fill: #1b2430; }
    .m { fill: #4a5565; }
    .ck { fill: #e4f3ea; stroke: #1d7a4f; stroke-width: 1.5; }
    .tick { stroke: #1d7a4f; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .ln { stroke: #1f5fbf; stroke-width: 2; fill: none; }
    .ah { fill: #1f5fbf; }
  </style>
  <rect x="1" y="1" width="798" height="408" rx="8" fill="#ffffff" stroke="#d9dee6"/>

  <rect x="30" y="24" width="270" height="170" rx="6" fill="#ffffff" stroke="#1b2430" stroke-width="2.5"/>
  <rect x="44" y="40" width="150" height="12" rx="2" fill="#1f5fbf"/>
  <rect x="44" y="64" width="242" height="7" rx="2" fill="#d9dee6"/>
  <rect x="44" y="80" width="76" height="46" rx="2" fill="#d9dee6"/>
  <rect x="132" y="80" width="76" height="46" rx="2" fill="#d9dee6"/>
  <rect x="220" y="80" width="66" height="46" rx="2" fill="#d9dee6"/>
  <rect x="44" y="138" width="242" height="7" rx="2" fill="#d9dee6"/>
  <rect x="44" y="154" width="170" height="7" rx="2" fill="#d9dee6"/>
  <text x="165" y="220" text-anchor="middle" font-size="14" font-weight="700">保存した全案の HTML を、幅 1280px・</text>
  <text x="165" y="240" text-anchor="middle" font-size="14" font-weight="700">高さ 720px のブラウザで開く</text>

  <path class="ln" d="M304 109 H334"/>
  <polygon class="ah" points="332,103 344,109 332,115"/>
  <text x="306" y="96" font-size="12" class="m">確かめる</text>

  <text x="364" y="34" font-size="14" font-weight="700" class="m">全案の検証</text>
  <g font-size="15">
    <circle class="ck" cx="364" cy="58" r="11"/><path class="tick" d="M358 58 l4 4 l8 -9"/>
    <text x="388" y="64">崩れがない（はみ出し・重なり・文字化け）</text>
    <circle class="ck" cx="364" cy="92" r="11"/><path class="tick" d="M358 92 l4 4 l8 -9"/>
    <text x="388" y="98">外部へのリクエストがない</text>
    <circle class="ck" cx="364" cy="126" r="11"/><path class="tick" d="M358 126 l4 4 l8 -9"/>
    <text x="388" y="132">危険な属性・要素がない（DOM 検査）</text>
  </g>

  <text x="364" y="178" font-size="14" font-weight="700" class="m">選んだ案の照合（要件のまとめと 6 点）</text>
  <g font-size="15">
    <circle class="ck" cx="364" cy="202" r="11"/><path class="tick" d="M358 202 l4 4 l8 -9"/>
    <text x="388" y="208">必須の内容が、すべて章に載っている</text>
    <circle class="ck" cx="364" cy="236" r="11"/><path class="tick" d="M358 236 l4 4 l8 -9"/>
    <text x="388" y="242">章の順序が、目的に沿っている</text>
    <circle class="ck" cx="364" cy="270" r="11"/><path class="tick" d="M358 270 l4 4 l8 -9"/>
    <text x="388" y="276">読み手が知らない言葉を、初出で説明している</text>
    <circle class="ck" cx="364" cy="304" r="11"/><path class="tick" d="M358 304 l4 4 l8 -9"/>
    <text x="388" y="310">目的に使う数値・比較・説明が、章ごとにある</text>
    <circle class="ck" cx="364" cy="338" r="11"/><path class="tick" d="M358 338 l4 4 l8 -9"/>
    <text x="388" y="344">結論が、最初の画面にある</text>
    <circle class="ck" cx="364" cy="372" r="11"/><path class="tick" d="M358 372 l4 4 l8 -9"/>
    <text x="388" y="378">分量が、指定の画面数または章の数に合う</text>
  </g>

  <text x="30" y="300" font-size="13" class="m">合わない点は直して確かめ直す。</text>
  <text x="30" y="320" font-size="13" class="m">回数は、崩れ・安全の検査・照合で</text>
  <text x="30" y="340" font-size="13" class="m">それぞれ最大 3 回。</text>
</svg>
